# ============================================================
# File: nginx/default.conf
# Cấu hình Nginx làm Reverse Proxy và Hardening Security Headers
# ============================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # ------------------------------------------------------------
    # Security Headers (Hardening cơ bản theo khuyến nghị OWASP)
    # ------------------------------------------------------------
    # Chống tấn công Clickjacking bằng cách ngăn nhúng iframe từ bên ngoài
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Kích hoạt bộ lọc XSS tích hợp sẵn trên trình duyệt cũ
    add_header X-XSS-Protection "1; mode=block" always;

    # Ngăn trình duyệt tự ý đoán định dạng MIME (MIME-type sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Kiểm soát thông tin Referrer khi chuyển hướng liên kết
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn kích thước tải lên để phòng tránh tấn công từ chối dịch vụ (DoS)
    client_max_body_size 20M;

    # ------------------------------------------------------------
    # Reverse Proxy chuyển tiếp traffic tới container web_app
    # ------------------------------------------------------------
    location / {
        proxy_pass http://web_app:80;

        # Truyền đúng thông tin client gốc cho Apache xử lý
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình thời gian chờ kết nối (Timeouts)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Trang thông báo lỗi mặc định của Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
